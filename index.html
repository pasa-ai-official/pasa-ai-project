<!DOCTYPE html>
<html lang="id">
<head>

            margin: 0;
            padding: 0;

            justify-content: center;
            align-items: center;

            text-align: center;
        }

            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);

            max-width: 600px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

            font-size: 1.2rem;

        }
        .badge {
            display: inline-block;
            background: #00ff88;
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 20px;

</head>
<body>
    <div class="container">
        <h1>PASA AI Project</h1>
